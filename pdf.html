<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Chatbot</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* General Page Styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a2b3c;
            color: #ffffff;
            text-align: center;
            padding: 0;
            margin: 0;
        }

        /* Header Section */
        .header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            background-color: #1a2b3c;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .header img {
            height: 50px;
            margin-right: 15px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            color: #ffffff;
        }

        /* Upload Section */
        .upload-container {
            max-width: 400px;
            margin: 30px auto;
            padding: 20px;
            background-color: #1a2b3c;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        input[type="file"] {
            padding: 10px;
            background-color: #1a2b3c;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        button {
            background-color: orange;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: rgb(223, 163, 79);
        }

        /* Chat Container */
        #chatContainer {
            display: none;
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            background-color: #161b22;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        /* Chat Box - Make it a flex container */
/* Chat Box - Ensure Flex Layout */
.chat-box {
    display: flex;
    flex-direction: column;
    align-items: flex-start; /* Aligns messages to the left by default */
    height: 300px;
    overflow-y: auto;
    background-color: #0d1117;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #30363d;
}

/* General Message Styling */
.message {
    padding: 10px;
    margin: 5px 0;
    border-radius: 8px;
    max-width: 75%;
    word-wrap: break-word;
}

/* User messages should be on the LEFT */
.user-message {
    background-color: rgba(255, 255, 255, 0.8);
    color: #0d1117;
    align-self: flex-end !important; /* Force left alignment */
    text-align: right;
}

/* Bot messages should be on the RIGHT */
.bot-message {
    background-color: #2d333b;
    color: white;
    align-self: flex-start !important; /* Force right alignment */
    text-align: left;
}



        #userInput {
            width: calc(100% - 90px);
            padding: 10px;
            border: 1px solid #30363d;
            border-radius: 5px;
            background-color: #0d1117;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <img src="static/logo.png" alt="Logo">
        <h1>Let's Talk with Your PDF</h1>
    </div>

    <!-- Upload Section -->
    <div class="upload-container">
        <h2>Upload Your PDF</h2>
        <input type="file" id="pdfFile" accept="application/pdf">
        <button onclick="uploadPDF()">Upload</button>
        <p id="status"></p>
    </div>

    <!-- Chat Section -->
    <div id="chatContainer">
        <h2>Chat with PDF</h2>
        <div class="chat-box" id="chatBox"></div>
        <input type="text" id="userInput" placeholder="Ask a question...">
        <button onclick="askQuestion()">Ask</button>
    </div>

    <script>
        function uploadPDF() {
            let fileInput = document.getElementById('pdfFile');
            let file = fileInput.files[0];
            if (!file) {
                alert('Please select a PDF file.');
                return;
            }

            let formData = new FormData();
            formData.append("file", file);

            fetch('/upload_pdf', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById("status").innerText = "Upload successful!";
                    document.getElementById("chatContainer").style.display = "block";
                } else {
                    document.getElementById("status").innerText = "Upload failed!";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById("status").innerText = "Error uploading file.";
            });
        }

        function askQuestion() {
    let userInput = document.getElementById("userInput").value;
    if (!userInput) {
        alert('Please enter a message.');
        return;
    }

    let chatBox = document.getElementById("chatBox");

    // User message (should be on the left)
    let userMessage = document.createElement("div");
    userMessage.className = "message user-message";
    userMessage.innerText = userInput;
    chatBox.appendChild(userMessage);
    chatBox.scrollTop = chatBox.scrollHeight;

    // Show typing indicator before bot response
    let typingIndicator = document.createElement("div");
    typingIndicator.className = "message bot-message";
    typingIndicator.id = "typing";
    typingIndicator.innerText = "Typing...";
    chatBox.appendChild(typingIndicator);
    chatBox.scrollTop = chatBox.scrollHeight;

    fetch('/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: userInput})
    })
    .then(response => response.json())
    .then(data => {
        // Remove typing indicator
        document.getElementById("typing").remove();

        // Bot response (should be on the right)
        let botMessage = document.createElement("div");
        botMessage.className = "message bot-message";
        botMessage.innerText = data.answer;
        chatBox.appendChild(botMessage);
        chatBox.scrollTop = chatBox.scrollHeight;
    })
    .catch(error => {
        console.error('Error:', error);
        document.getElementById("typing").remove();
        let errorMessage = document.createElement("div");
        errorMessage.className = "message bot-message";
        errorMessage.innerText = "Error retrieving response.";
        chatBox.appendChild(errorMessage);
        chatBox.scrollTop = chatBox.scrollHeight;
    });
}


    </script>
</body>
</html>
